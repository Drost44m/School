<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>New Home - Application</title>
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="stylesheet" href="css/apply.css" />
    </head>
    <body>
        <nav class="main-nav">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/browse" class="active">Browse Pets</a></li>
                <li><a href="/applications">View Applications</a></li>
                <li><a href="/about">About Us</a></li>
            </ul>
        </nav>

        <header class="banner">
            <img src="images/banner.jpg" alt="New Home Animal Rescue Banner" class="banner-img">
        </header>

        <section class="form-section">
            <form id="adoptionForm">
                <!-- Pet info will be added here via JS -->
                <div id="petApplicationInfo" class="pet-info"></div>

                <h2>Your Information</h2>
                <input type="text" id="name" placeholder="Full Name">
                <input type="email" id="email" placeholder="Email Address">
                <input type="tel" id="phone" placeholder="Phone Number">
                <input type="text" id="address" placeholder="Home Address">
                <input type="number" id="residents" placeholder="Number of Residents in Home" min="1">

                <h2>Current Pets in Your Home</h2>
                <textarea id="currentPets" placeholder="List other pets you currently have (species, age, health)" rows="3"></textarea>

                <h2>Pet Experience</h2>
                <label>Do you have experience with this type of pet?</label>
                <select id="experience">
                    <option value="">-- Select --</option>
                    <option value="None">None</option>
                    <option value="Some">Some</option>
                    <option value="Extensive">Extensive</option>
                </select>

                <label>Where will this pet primarily live?</label>
                <select id="location">
                    <option value="">-- Select --</option>
                    <option value="Indoor">Indoor</option>
                    <option value="Outdoor">Outdoor</option>
                    <option value="Both">Both</option>
                </select>

                <h2>Support Us</h2>
                <label>Optional Donation</label>
                <select id="donation">
                    <option value="0">$0</option>
                    <option value="10">$10</option>
                    <option value="25">$25</option>
                    <option value="50">$50</option>
                </select>

                <h2>Agreements</h2>
                <label>
                    <input type="checkbox" id="agreement1" required> I agree to provide proper care, food, shelter, and medical attention.
                </label>
                <label>
                    <input type="checkbox" id="agreement2" required> I understand that this application does not guarantee adoption.
                </label>

                <button type="submit" id="submitBtn" disabled>Submit Application</button>
            </form>
        </section>

        <footer class="site-footer">
            <p>© 2026 New Home Animal Rescue | Adopt your new best friend</p>
        </footer>

        <script src="js/apply.js"></script>
    </body>
</html>
