<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>View Applications</title>
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="stylesheet" href="css/applications.css" />
    </head>
    <body>
        <nav class="main-nav">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/browse">Browse Pets</a></li>
                <li><a href="/applications" class="active">View Applications</a></li>
                <li><a href="/about">About Us</a></li>
            </ul>
        </nav>

        <header class="banner">
            <img src="images/banner.jpg" alt="New Home Animal Rescue Banner" class="banner-img">
        </header>

        <section class="applications-section">
            <h2>Adoption Applications</h2>
            <p id="applicationsMessage" class="applications-message"></p>
            <table id="applicationsTable" class="applications-table hidden">
                <thead>
                    <tr>
                        <th>Date Submitted</th>
                        <th>Application ID</th>
                        <th>Shelter ID</th>
                        <th>Pet ID</th>
                        <th>Pet Type</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="applicationsBody"></tbody>
            </table>
        </section>

        <section id="applicationDetails" class="application-details hidden"></section>

        <footer class="site-footer">
            <p>© 2026 New Home Animal Rescue | Adopt your new best friend</p>
        </footer>

        <script src="js/applications.js"></script>
    </body>
</html>
