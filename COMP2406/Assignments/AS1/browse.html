<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawsibility - Browse</title>
<link rel="stylesheet" href="styles/styles.css">
<link rel="stylesheet" href="styles/browse.css">
</head>
<body>

  <!-- Navigation menu, same on every page -->
  <nav>
    <a href="index.html">Home</a>
    <a href="browse.html" class="selected" aria-current="page">Browse Pets</a>
    <a href="about.html">About Us</a>
  </nav>

  <!-- Banner, same on every page -->
  <div class="banner">
    <h1>Pawsibility</h1>
    <p>Every Paw Deserves a Loving Home</p>
    <img src="images/Banner.jpeg" alt="A newly adopted dog">
  </div>

  <div class="section">
    <h1>Select a Shelter</h1>
    <!-- Options are added by browse.js from shelterData.js -->
    <select id="shelterSelect" aria-label="Select a shelter">
      <option value="" selected>-- Select a Shelter --</option>
    </select>

    <!-- Hidden until a shelter is picked; browse.js enables/disables these -->
    <div class="type-buttons" id="typeButtons" hidden>
      <button data-type="all">All</button>
      <button data-type="cat">Cats</button>
      <button data-type="dog">Dogs</button>
      <button data-type="bird">Birds</button>
      <button data-type="reptile">Reptiles</button>
      <button data-type="other">Other</button>
    </div>
  </div>

  <!-- Pet cards are added here by browse.js -->
  <section class="pet-grid" id="petGrid"></section>

  <!-- Footer, same on every page -->
  <footer>
    &copy; 2026 Pawsibility | Every Paw Deserves a Loving Home
  </footer>

  <script src="scripts/shelterData.js"></script>
  <script src="scripts/browse.js"></script>

</body>
</html>
