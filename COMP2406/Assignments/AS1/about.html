<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawsibility - About</title>
<link rel="stylesheet" href="styles/styles.css">
<link rel="stylesheet" href="styles/about.css">
</head>
<body>

  <!-- Navigation menu, same on every page -->
  <nav>
    <a href="index.html">Home</a>
    <a href="browse.html">Browse Pets</a>
    <a href="about.html" class="selected" aria-current="page">About Us</a>
  </nav>

  <!-- Banner, same on every page -->
  <div class="banner">
    <h1>Pawsibility</h1>
    <p>Every Paw Deserves a Loving Home</p>
    <img src="images/Banner.jpeg" alt="A newly adopted dog">
  </div>

  <!-- Mission paragraph is filled in by about.js from aboutData.js -->
  <div class="section mission">
    <h1>Our Mission</h1>
    <p id="missionText"></p>
    <img src="images/pawsibility_atWork.jpeg" alt="Employees caring for animals at the shelter">
  </div>

  <!-- Team description and table rows are filled in by about.js from aboutData.js -->
  <div class="section team">
    <h1>Our Team</h1>
    <p id="teamDescription"></p>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Experience</th>
          <th>Qualifications</th>
        </tr>
      </thead>
      <!-- One row per team member, added by about.js -->
      <tbody id="teamTableBody"></tbody>
    </table>
  </div>

  <!-- Footer, same on every page -->
  <footer>
    &copy; 2026 Pawsibility | Every Paw Deserves a Loving Home
  </footer>

  <script src="scripts/aboutData.js"></script>
  <script src="scripts/about.js"></script>

</body>
</html>
