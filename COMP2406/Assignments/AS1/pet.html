<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawsibility - Pet Details</title>
<link rel="stylesheet" href="styles/styles.css">
<link rel="stylesheet" href="styles/pet.css">
</head>
<body>

  <!-- Navigation menu, same on every page -->
  <nav>
    <a href="index.html">Home</a>
    <a href="browse.html" class="selected" aria-current="page">Browse Pets</a>
    <a href="about.html">About Us</a>
  </nav>

  <!-- Banner, same on every page -->
  <div class="banner">
    <h1>Pawsibility</h1>
    <p>Every Paw Deserves a Loving Home</p>
    <img src="images/Banner.jpeg" alt="A newly adopted dog">
  </div>

  <!-- pet.js points this back to browse.html with the right shelter selected -->
  <div class="section back-link">
    <a id="backLink" href="browse.html">&laquo; Back to Browsing</a>
  </div>

  <!-- All of this is filled in by pet.js, based on the pet chosen in browse.html -->
  <div class="section pet-detail">
    <img id="petImage" src="" alt="">
    <h1 id="petName"></h1>
    <p id="petSummary"></p>
    <p id="petHealth"></p>
    <p id="petTraits"></p>
    <p id="petDays"></p>

    <p class="fees" id="petFees"></p>

    <!-- pet.js sends petId/shelter/fee info to apply.html when clicked -->
    <button id="applyButton" type="button">Apply to Adopt this Pet</button>
  </div>

  <!-- Footer, same on every page -->
  <footer>
    &copy; 2026 Pawsibility | Every Paw Deserves a Loving Home
  </footer>

  <script src="scripts/shelterData.js"></script>
  <script src="scripts/pet.js"></script>

</body>
</html>
