<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>The Laughing Ladle – Cart</title>
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="styles/cart.css">
    </head>

    <body>
        <!-- Header -->
        <header>
            <img src="images/banner.jpg" alt="restaurant name banner">
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/menu">Menu</a>
                <a href="/locations">Locations</a>
                <a href="/reservations">Reservations</a>
            </div>
        </header>

        <h1>Your Cart</h1>
        <p>Review your selected items before placing your order.</p>

        <div class="menu-category">
            <table id="cart-table">
                <tbody id="cart-items">
                    <!-- JS inserts item rows here -->
                </tbody>
                <tbody>
                    <tr class="blank-row">
                        <td colspan="2"></td>
                    </tr>
                    <tr>
                        <td style="text-align:left;">HST (13%)</td>
                        <td id="hst" style="text-align:right;">$0.00</td>
                    </tr>
                    <tr class="divider-row">
                        <td colspan="2"></td>
                    </tr>
                    <tr>
                        <td style="text-align:left;"><strong>Total</strong></td>
                        <td id="cart-total" style="text-align:right;"><strong>$0.00</strong></td>
                    </tr>
                </tbody>
            </table>

            <a id="place-order-btn">Place Order</a>
            <p id="order-message" class="hidden"></p>
        </div>

        <!-- Footer -->
        <footer>
            <hr>
            <p>&copy; 2026 The Laughing Ladle</p>
            <a href="/contact">Contact Us</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
        </footer>

        <script src="scripts/cart-page.js"></script>
    </body>
</html>
